<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Data Nilai</title>
</head>
<body class="bg-light py-5">

  <div class="container" style="max-width: 800px;">
    
    <div class="card shadow-sm p-4 mb-4 bg-white rounded-3">
      <h2 class="text-dark fw-bold mb-4 text-center">Rekapitulasi Data Nilai Siswa</h2>
      
      <div class="table-responsive">
        <table class="table table-striped table-bordered text-center align-middle">
          
          <thead class="table-dark align-middle">
            <tr>
              <th rowspan="2" class="py-3">Nama</th>
              <th colspan="3">Nilai</th>
            </tr>
            <tr>
              <th>Kimia</th>
              <th>Fisika</th>
              <th>Biologi</th>
            </tr>
          </thead>
          
          <tbody>
            <tr>
              <td class="fw-semibold text-start ps-3">Robby</td>
              <td>76</td>
              <td>80</td>
              <td><span class="badge bg-success">81</span></td>
            </tr>
            <tr>
              <td class="fw-semibold text-start ps-3">Rendi</td>
              <td>84</td>
              <td>70</td>
              <td>75</td>
            </tr>
            <tr>
              <td class="fw-semibold text-start ps-3">Alfian</td>
              <td><span class="badge bg-primary">96</span></td>
              <td>70</td>
              <td>71</td>
            </tr>
          </tbody>

        </table>
      </div>
    </div>
    
    <nav class="d-flex justify-content-center gap-2">
      <a href="index.html" class="btn btn-outline-secondary px-4 py-2 fw-semibold">Kembali ke Beranda</a>
      <a href="form.html" class="btn btn-primary px-4 py-2 fw-semibold">Isi Form Lagi</a>
    </nav>

  </div>

</body>
</html>
