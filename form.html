<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form HTML</title>
</head>
    <body>
        <h1>Buat Account Baru</h1>
         <p>Sign up untuk bergabung dengan kami!</p>
        <h3>Sign Up Form</h3>
        <form action="welcome.html" method="get">
            <label for="first-name">First name:</label><br>
            <input type="text" id="first-name" name="first-name"><br>
            <label for="last-name">Last name:</label><br>
            <input type="text" id="last-name" name="last-name"><br><br>
            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
            
            <p>Nationality:</p>
            <select id="nationality" name="nationality">
                <option value="indonesian">Indonesian</option>
                <option value="amerika">Amerika</option>
                <option value="inggris">Inggris</option>
            </select>
            <p>Language Spoken:</p>
            <input type="checkbox" id="bahasa-indonesia" name="language" value="bahasa-indonesia">
            <label for="bahasa-indonesia">Bahasa Indonesia</label><br>
            <input type="checkbox" id="english" name="language" value="english">
            <label for="english">English</label><br> 
            <input type="checkbox" id="other" name="language" value="other">
            <label for="other">Other</label><br><br>   
            <label for="bio">Bio:</label><br>
            <textarea id="bio" name="bio" rows="10" cols="50"></textarea><br><br>    
            <input type="submit" value="Sign Up">        
        </form>
    </body>
</html>
